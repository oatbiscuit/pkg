name: check outdated

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check_outdated:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: find outdated binaries
        id: find-outdated
        run: |
          touch outdated
          find extra pkg -name "version" -type f 2>/dev/null | while read versionpath; do
            package=$(basename "$(dirname "$versionpath")")
            version=$(awk '{print $1}' "$versionpath")

            echo "Checking package: $package (version: $version)"
            
            # remap weird package names
            repology_package=$(
              case $package in
                act) echo "act-run-github-actions" ;;
                *) echo "$package" ;;
              esac
            )

            echo "Repology package name: $repology_package"
            
            latest=$(curl --location --silent --user-agent 'github/kiss-community outdated tracker' "https://repology.org/api/v1/project/$repology_package" \
              | jq -r  '.[] | select(.srcname == "'$repology_package'") | .version' \
              | grep -E '^[0-9]+(\.[0.9]+)*$' \
              | sort -V \
              | tail -1)

            if [[ -z "$latest" ]]; then
              echo "Trying without filtering..."
              latest=$(curl --location --silent --user-agent 'github/kiss-community outdated tracker' "https://repology.org/api/v1/project/$repology_package" \
              | jq -r  '.[] | .version' \
              | grep -E '^[0-9]+(\.[0.9]+)*$' \
              | sort -V \
              | tail -1)
            fi

            echo "Latest version found: $latest"
            
            if [[ -n "$latest" ]] && [[ "$version" != "$latest" ]]; then
              echo "- [ ] $package: $version -> $latest" >> outdated
            elif [[ -n "$latest" ]]; then
              echo "$package is up to date ($version)"
            else
              echo "Could not find $package on Repology"
            fi
            echo "---"
          done
          echo "::set-output name=content::$(cat outdated)"

      - uses: JasonEtco/create-an-issue@v2
        id: create-issue
        with:
          update_existing: true
          filename: .github/outdated.md
        env:
          CONTENT: ${{ steps.find-outdated.outputs.content }}
