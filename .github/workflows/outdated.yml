name: check outdated

on:
  schedule:
    # Runs every sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check_outdated:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup KISS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
          sudo curl -sL https://codeberg.org/kiss-community/kiss/raw/branch/master/contrib/kiss-outdated > /usr/local/bin/kiss-outdated
          sudo curl -sL https://codeberg.org/kiss-community/kiss/raw/branch/master/kiss > /usr/local/bin/kiss
          sudo chmod +x /usr/local/bin/kiss-outdated /usr/local/bin/kiss

      - name: find outdated binaries
        id: find-outdated
        run: |
          echo "" >> outdated.txt
          /usr/local/bin/kiss-outdated extra/ pkg/ 2>&1 | \
            grep -v '^\[Checking' | \
            grep -v '^[[:space:]]*$' | \
            grep -v '^[[:space:]]*\[[[:space:]]*\]' | \
            while read line; do
              echo "- [ ] $line" >> outdated.txt
            done

          if [[ ! -s outdated.txt ]]; then
            echo "No outdated packages found." > outdated.txt
          fi
          
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat outdated.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: JasonEtco/create-an-issue@v2
        id: create-issue
        with:
          update_existing: true
          filename: .github/outdated.md
        env:
          CONTENT: ${{ steps.find-outdated.outputs.content }}
